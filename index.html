<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by AaronOptimus</title>
<meta name="description" content="Simple, private Windows apps.">
<link rel="icon" href="pagewright-icon.png">
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1b1d21; --muted:#5d6470; --accent:#c2410c; --border:#dde1e7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1d20; --panel:#26282c; --text:#eceef1; --muted:#a3a9b3; --accent:#f97316; --border:#3a3d43; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 "Segoe UI", system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:36px; margin:0; line-height:1.15; }
  .tag { color:var(--muted); font-size:18px; margin:6px 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
  .app { display:flex; gap:16px; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 20px; color:inherit; text-decoration:none; }
  .app:hover { border-color:var(--accent); }
  .app img { width:56px; height:56px; border-radius:12px; flex:none; }
  .app h2 { font-size:18px; margin:0; }
  .app p { margin:2px 0 0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Apps by AaronOptimus</h1>
  <p class="tag">Simple, private Windows apps that work offline.</p>
  <div class="grid">
    <a class="app" href="pagewright/">
      <img src="pagewright-icon.png" alt="">
      <div><h2>Pagewright</h2><p>Merge, split and organize PDFs, add page numbers and watermarks.</p></div>
    </a>
  </div>
</main>
</body>
</html>
